[project]
name = "q1-leg-urdf"
version = "0.1.0"
description = "Q1 biped URDF, MediaPipe retargeting, PPO curriculum and web player"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "gymnasium>=1.0", "mujoco>=3.2", "stable-baselines3>=2.4", "psutil>=5.9", "xacro>=2.0", "pyyaml>=6", "openpyxl>=3"]

[project.optional-dependencies]
motion = ["mediapipe>=0.10.14", "opencv-python-headless>=4.8", "yt-dlp>=2026.8.19", "yt-dlp-ejs"]
test = ["pytest>=8", "playwright>=1.50"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["source/leg_humanoid_lab"]
testpaths = ["tests"]
